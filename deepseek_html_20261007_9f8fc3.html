<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Boya Chinese II · Тренажёр</title>
    <style>
        /* ---------- CSS Variables: Light / Dark Theme ---------- */
        :root {
            --bg: #f7f5f0;
            --surface: #ffffff;
            --surface-alt: #f0ede8;
            --text: #2c2c2c;
            --text-muted: #6b6b6b;
            --primary: #b33e2c;
            --primary-soft: #f7e6e3;
            --accent: #c99a3b;
            --accent-soft: #fdf3e0;
            --border: #ddd8d0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --font-scale: 1;
            --transition: 0.2s ease;
            --card-bg: #ffffff;
            --card-back: #fcf8f2;
            --success: #3e7c4b;
            --error: #c0392b;
            --warning: #e67e22;
            --font-chinese: "KaiTi", "STKaiti", "Kai", "Noto Serif SC", "SimSun", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        [data-theme="dark"] {
            --bg: #1a1a1e;
            --surface: #25252b;
            --surface-alt: #2d2d35;
            --text: #e8e6e3;
            --text-muted: #9a9a9a;
            --primary: #e06b5a;
            --primary-soft: #3a2522;
            --accent: #e0b35c;
            --accent-soft: #3a3220;
            --border: #3d3d45;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --card-bg: #2d2d35;
            --card-back: #36363e;
            --success: #4caf7c;
            --error: #e74c3c;
        }
        /* Large / Compact */
        [data-size="large"] { --font-scale: 1.25; }
        [data-size="compact"] { --font-scale: 0.9; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: calc(16px * var(--font-scale)); scroll-behavior: smooth; }
        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0.8rem;
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .app {
            max-width: 1100px;
            margin: 0 auto;
        }
        /* ---------- Typography ---------- */
        h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; }
        h1 { font-size: 1.6rem; }
        h2 { font-size: 1.3rem; }
        h3 { font-size: 1.1rem; }
        p { line-height: 1.6; }
        .chinese {
            font-family: var(--font-chinese);
            line-height: 1.8;
            letter-spacing: 0.02em;
        }
        .pinyin {
            color: var(--text-muted);
            font-size: 0.9em;
            font-style: italic;
        }
        .translation {
            color: var(--text-muted);
            font-size: 0.95em;
        }
        /* ---------- Buttons & Inputs ---------- */
        button {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.7em 1.2em;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        button:hover, button:focus-visible {
            background: var(--surface-alt);
            border-color: var(--primary);
            outline: none;
        }
        button:active { transform: scale(0.97); }
        button.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        button.primary:hover { opacity: 0.9; }
        button.accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        button.accent:hover { opacity: 0.9; }
        button.small { padding: 0.4em 0.8em; font-size: 0.85rem; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        input[type="text"], textarea, select {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.6em 0.8em;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            width: 100%;
            transition: border var(--transition);
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }
        /* ---------- Layout ---------- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.6rem 0;
            margin-bottom: 0.8rem;
        }
        .header-left { display: flex; align-items: center; gap: 0.6rem; }
        .header-right { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
        .logo {
            font-family: var(--font-chinese);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            white-space: nowrap;
        }
        .logo span { font-family: var(--font-ui); font-size: 0.75rem; color: var(--text-muted); display: block; line-height: 1; }
        .theme-toggle, .size-toggle {
            background: var(--surface-alt);
            border: none;
            padding: 0.4em 0.6em;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.7rem;
            margin-bottom: 1.2rem;
        }
        .menu-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            font-weight: 500;
        }
        .menu-card:hover, .menu-card:focus-visible {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }
        .menu-card .icon { font-size: 1.6rem; line-height: 1; }
        .menu-card .label { font-size: 0.9rem; }
        .menu-card .sub { font-size: 0.75rem; color: var(--text-muted); }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .panel-header h2 { margin: 0; }
        .hidden { display: none !important; }
        /* ---------- Flashcard ---------- */
        .flashcard-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .flashcard {
            width: 100%;
            max-width: 500px;
            min-height: 240px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
            background: var(--card-back);
        }
        .flashcard-inner {
            backface-visibility: hidden;
            transition: transform 0.4s ease;
            width: 100%;
        }
        .flashcard-front, .flashcard-back {
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
        }
        .flashcard-front .chinese { font-size: 2.2rem; }
        .flashcard-back .chinese { font-size: 1.6rem; }
        .flashcard-back .pinyin { font-size: 1.1rem; }
        .flashcard-back .translation { font-size: 1.1rem; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        /* ---------- Exercise / Quiz ---------- */
        .exercise-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .option-btn {
            text-align: left;
            padding: 0.8em 1em;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: all var(--transition);
            width: 100%;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .option-btn.correct {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .option-btn.incorrect {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }
        .feedback {
            font-weight: 500;
            padding: 0.5rem 0;
            min-height: 1.5em;
        }
        .feedback.correct { color: var(--success); }
        .feedback.incorrect { color: var(--error); }
        /* ---------- Stats / Progress ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.7rem;
        }
        .stat-item {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            text-align: center;
        }
        .stat-item .value { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
        .stat-item .label { font-size: 0.8rem; color: var(--text-muted); }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--surface-alt);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar > div {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        /* ---------- Lists & Tables ---------- */
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.4rem;
            border-bottom: 1px solid var(--border);
            gap: 0.5rem;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .chinese { font-size: 1.1rem; }
        .list-item .pinyin { font-size: 0.85rem; }
        .list-item .translation { font-size: 0.9rem; }
        .ticket-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 0.7rem;
            cursor: pointer;
            transition: border var(--transition);
        }
        .ticket-card:hover { border-color: var(--primary); }
        .ticket-card .ticket-title {
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-card .ticket-body {
            margin-top: 0.6rem;
            font-size: 0.95rem;
        }
        .tag {
            display: inline-block;
            padding: 0.15em 0.6em;
            border-radius: 20px;
            font-size: 0.75rem;
            background: var(--surface-alt);
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-right: 0.3rem;
            margin-bottom: 0.2rem;
        }
        .tag.primary { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
        .tag.accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.2rem;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.2em 0.4em;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text); }
        /* ---------- Misc ---------- */
        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-1 { gap: 0.4rem; }
        .gap-2 { gap: 0.8rem; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .w-full { width: 100%; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        @media (max-width: 500px) {
            .grid-2 { grid-template-columns: 1fr; }
            .main-menu { grid-template-columns: repeat(2, 1fr); }
        }
        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface-alt); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Chinese text in UI */
        .chinese-text { font-family: var(--font-chinese); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--text);
            padding: 0.7em 1.4em;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; }
    </style>
</head>

    { id:31, lesson:12, title:'把字句 (2)', formula:'否定词/助动词 + 把 + O + V', explanation:'Отрицание и модальные глаголы перед 把', examples:['他今天没把作业做完。','别把电视摔坏了。','你应该把药吃了再睡觉。'] },

const TEXTS = [
    { id:1, lesson:1, title:'飞机晚点了', titleRu:'Самолёт опоздал', content:'莎：李军，李军！\n李军：玛莎，是你呀！\n玛莎：你一进门，我就看见你了。来接人？\n李军：对，来接我姐姐。她坐下午的飞机回北京。你呢？\n玛莎：我刚送我父母回国。\n李军：你父母来北京了？\n玛莎：对，他们在北京玩儿了三天，今天回国了。你姐姐的航班几点到？\n李军：应该是两点半。奇怪，都两点五十了，怎么飞机还没到？我去问问。\n（问机场工作人员）请问，从泰国来的飞机到了吗？\n工作人员：我查一下儿，还没到。这次航班可能要晚点三十分钟。', translation:'Маша: Ли Цзюнь, Ли Цзюнь!\nЛи Цзюнь: Маша, это ты! \nМаша: Как только ты вошёл, я тебя увидела. Встречаешь кого-то?\nЛи Цзюнь: Да, встречаю старшую сестру. Она летит дневным рейсом в Пекин. А ты?\nМаша: Я только что проводила родителей на родину.\nЛи Цзюнь: Твои родители приезжали в Пекин?\nМаша: Да, они гуляли по Пекину три дня, сегодня улетели домой. Когда прилетает рейс твоей сестры?\nЛи Цзюнь: Должен был в половине третьего. Странно, уже без десяти три, а самолёт всё ещё не прилетел? Пойду спрошу.\n(Спрашивает сотрудника аэропорта) Извините, самолёт из Таиланда уже прилетел?\nСотрудник: Сейчас проверю, ещё нет. Этот рейс, возможно, задержится на тридцать минут.' },
    { id:2, lesson:1, title:'玛莎的日记', titleRu:'Дневник Маши', content:'我父亲和母亲上星期来北京了，他们在北京玩儿了三天，他们很喜欢北京，打算以后有机会再来。今天下午他们回国，我去机场送他们。我父母的飞机是下午两点十分的，飞机正点起飞。在机场，我遇到了李军，他是来接姐姐的，可是，他姐姐的航班晚点了，李军等了差不多半个小时。', translation:'Мои отец и мать приехали в Пекин на прошлой неделе, они гуляли по Пекину три дня, им очень понравился Пекин, они планируют приехать ещё, если будет возможность. Сегодня днём они улетели домой, я проводила их в аэропорт. Самолёт моих родителей был в два часа десять минут дня, самолёт вылетел по расписанию. В аэропорту я встретила Ли Цзюня, он приехал встречать сестру, но рейс его сестры задержался, Ли Цзюнь ждал почти полчаса.' },
    { id:3, lesson:2, title:'我想搬到外面去', titleRu:'Я хочу переехать', content:'李军：萨沙，好久不见，最近忙什么呢？\n萨沙：找房子呢，我想搬到外面去。\n李军：住在学校里不好吗？你看，学校里有商店、食堂，还有邮局和银行，多方便啊。离教室也很近，每天你可以多睡会儿懒觉，而且房租也比外面的便宜。\n萨沙：可是，学校的宿舍没有厨房，房间里也没有卫生间，生活有些不方便。最主要的是，周围都是留学生，对练习汉语没好处。\n李军：你说的也是。\n萨沙：你帮我注意一下儿有没有合适的房子，好不好？\n李军：没问题，我有一个朋友就在中介公司工作。', translation:'Ли Цзюнь: Саша, давно не виделись, чем занимаешься в последнее время?\nСаша: Ищу жильё, хочу переехать.\nЛи Цзюнь: Разве плохо жить в кампусе? Смотри, в кампусе есть магазин, столовая, почта и банк, как удобно. И до аудитории близко, каждый день можешь поспать подольше, к тому же аренда дешевле, чем снаружи.\nСаша: Но в общежитии нет кухни, в комнате нет туалета, жить не очень удобно. Главное, вокруг одни иностранные студенты, для практики китайского нет пользы.\nЛи Цзюнь: Ты прав.\nСаша: Помоги мне посмотреть, нет ли подходящего жилья, хорошо?\nЛи Цзюнь: Без проблем, у меня есть друг, который работает в агентстве недвижимости.' },
    { id:4, lesson:2, title:'萨沙的日记', titleRu:'Дневник Саши', content:'昨天我的一个朋友来了，我发现他的汉语进步很快。以前我和他的水平差不多，现在他比我高多了，说得也比我流利。原来他现在住在中国人的家里。我也想搬到外面去了。我想找一套公寓，离学校不要太远，最好有厨房和卫生间。真希望早点儿搬家。', translation:'Вчера приехал мой друг, я обнаружил, что его китайский быстро прогрессирует. Раньше мой уровень был примерно таким же, как у него, теперь он намного выше меня, и говорит он беглее меня. Оказывается, он сейчас живёт в китайской семье. Я тоже хочу переехать. Я хочу найти квартиру не слишком далеко от школы, желательно с кухней и туалетом. Очень надеюсь на скорый переезд.' },
    { id:5, lesson:3, title:'她穿着一件黄衬衫', titleRu:'Она одета в жёлтую блузку', content:'玛莎：警察先生，我和我的朋友走散了，麻烦你们找一下儿。\n警察：别着急，你坐着说吧。她叫什么名字？是哪国人？\n玛莎：她叫安娜，是德国人。她刚来中国不久，汉语说得还不太好。\n警察：她多大年纪？长什么样子？\n玛莎：大概二十三四岁，黄头发，蓝眼睛，个子不太高，一米六多吧。\n警察：穿什么衣服？\n玛莎：她穿着一件黄衬衫，一条蓝牛仔裤，背着一个大旅行包。\n警察：你们是什么时候走散的？\n玛莎：下午两点半左右。\n警察：别着急，我们一定帮你找到她。', translation:'Маша: Господин полицейский, я и моя подруга разминулись, помогите её найти.\nПолицейский: Не волнуйтесь, садитесь и расскажите. Как её зовут? Из какой она страны?\nМаша: Её зовут Анна, она немка. Она недавно приехала в Китай, говорит по-китайски ещё плохо.\nПолицейский: Сколько ей лет? Как она выглядит?\nМаша: Примерно двадцать три-четыре года, светлые волосы, голубые глаза, не очень высокого роста, чуть больше метра шестидесяти.\nПолицейский: Во что она одета?\nМаша: Она в жёлтой рубашке, синих джинсах, несёт на спине большой рюкзак.\nПолицейский: Когда вы разминулись?\nМаша: Около половины третьего дня.\nПолицейский: Не волнуйтесь, мы обязательно поможем её найти.' },
    { id:6, lesson:4, title:'俄罗斯没有这么多自行车', titleRu:'В России нет такого количества велосипедов', content:'李军：萨沙，你来中国的时间不短了，你觉得中国和俄罗斯一样吗？\n萨沙：有的地方一样，有的地方不一样。\n李军：比如说\n萨沙：俄罗斯和中国一样，都是大国，面积都不小，但是俄罗斯人口没有中国那么多，历史也没有中国那么长。另外，生活水平有点儿不一样。\n李军：说得不错。还有吗？\n萨沙：还有，俄罗斯没有这么多自行车。\n李军：那人们上班、上学都开车吗？\n萨沙：不一定，有的坐公共汽车，有的坐地铁，还有的开车。', translation:'Ли Цзюнь: Саша, ты в Китае уже немало времени, как ты думаешь, Китай и Россия одинаковы?\nСаша: В чём-то одинаковы, в чём-то разные.\nЛи Цзюнь: Например?\nСаша: Россия и Китай одинаковы в том, что обе большие страны, площадь немаленькая, но население России не такое большое, как в Китае, и история не такая длинная. К тому же уровень жизни немного отличается.\nЛи Цзюнь: Хорошо сказано. Ещё что-нибудь?\nСаша: Ещё в России нет такого количества велосипедов.\nЛи Цзюнь: И люди на работу, в школу ездят на машинах?\nСаша: Не обязательно, некоторые на автобусе, некоторые на метро, а некоторые на машине.' },
    { id:7, lesson:4, title:'发现中国有几多', titleRu:'Обнаружил, что в Китае есть несколько "много"', content:'来中国以后，我发现中国有几“多”：一是人多，有十三亿人口，公共汽车上、商店里、路上，到处都是人；二是车多，上班、下班的时候，马路上的汽车、自行车像河流一样，很壮观；三是中国菜的种类多，听说有名的菜就有八大菜系；四是名胜古迹多，中国有几千年的历史，名胜古迹当然很多；五是民族多，有55个少数民族；还有……我在慢慢发现呢。', translation:'После приезда в Китай я обнаружил, что в Китае есть несколько "много": во-первых, людей много — 1,3 миллиарда населения, в автобусах, магазинах, на улицах — везде люди; во-вторых, машин много — в часы пик машины и велосипеды на дорогах как реки, очень впечатляюще; в-третьих, видов китайской кухни много — говорят, только известных кухонь восемь; в-четвёртых, достопримечательностей много — у Китая тысячелетняя история, конечно, много достопримечательностей; в-пятых, национальностей много — 55 национальных меньшинств; и ещё... я постепенно открываю.' },
    { id:8, lesson:5, title:'这家餐厅的菜不错', titleRu:'Еда в этом ресторане неплохая', content:'萨沙：两位女士吃饱了吗？要不要再点一个菜？\n玛莎：够了，我已经吃好了。\n安娜：我也吃饱了。这家餐厅的菜真不错。萨沙，以前你经常来这儿吗？\n萨沙：不常来，一个星期两三次吧。\n安娜：你每天都在哪儿吃饭？\n萨沙：有的时候在食堂，有的时候去饭馆，偶尔也自己做。\n玛莎：你会做饭？我还是第一次听说。\n萨沙：很少做。自己做饭比在外面吃便宜，不过没有饭馆的菜那么好吃。\n安娜：你会做什么饭？\n萨沙：水平最高的当然是煮方便面。\n玛莎：那你和我一样啊！', translation:'Саша: Дамы, вы наелись? Не заказать ли ещё одно блюдо?\nМаша: Достаточно, я уже наелась.\nАнна: Я тоже наелась. Еда в этом ресторане действительно неплохая. Саша, ты раньше часто сюда приходил?\nСаша: Не часто, раза два-три в неделю.\nАнна: А где ты каждый день ешь?\nСаша: Иногда в столовой, иногда в ресторане, иногда сам готовлю.\nМаша: Ты умеешь готовить? Впервые слышу.\nСаша: Редко готовлю. Самому готовить дешевле, чем есть вне дома, но не так вкусно, как в ресторане.\nАнна: Что ты умеешь готовить?\nСаша: Самый высокий уровень — это, конечно, варить лапшу быстрого приготовления.\nМаша: Тогда ты такой же, как я!' },
    { id:9, lesson:6, title:'广告栏上贴着一个通知', titleRu:'На информационном стенде висит уведомление', content:'玛莎：宿舍楼门口围着一些人，发生了什么事？\n中村：走，过去看看。\n玛莎：啊，广告栏上贴着一个通知。\n中村：好像是一个活动的通知。\n玛莎：中村，有的字我不认识，你帮我读一下儿吧。\n中村：“九月二十日，国际交流学院将组织留学生去郊区参观，准备参加活动的同学，请带学生证到学院办公室报名。”学院要带我们去郊区参观。\n玛莎：太好了！什么时候报名？\n中村：下午两点到五点半。\n玛莎：在哪儿报名？\n中村：学院办公室。\n玛莎：要办什么手续？\n中村：带学生证就行了。\n玛莎：我马上就去拿。你回宿舍去吗？\n中村：不，我还有点儿事，你先上去吧。', translation:'Маша: У входа в общежитие собрались люди, что случилось?\nНакамура: Пойдём, посмотрим.\nМаша: А, на доске объявлений висит уведомление.\nНакамура: Кажется, объявление о мероприятии.\nМаша: Накамура, я не все иероглифы знаю, помоги мне прочитать.\nНакамура: "20 сентября Международный институт организует для иностранных студентов экскурсию в пригород. Желающие принять участие, возьмите студенческий билет и зарегистрируйтесь в офисе института." Институт хочет повезти нас на экскурсию в пригород.\nМаша: Отлично! Когда регистрация?\nНакамура: С двух до половины шестого.\nМаша: Где регистрироваться?\nНакамура: В офисе института.\nМаша: Какие нужны формальности?\nНакамура: Достаточно взять студенческий билет.\nМаша: Я сейчас же пойду возьму. Ты возвращаешься в общежитие?\nНакамура: Нет, у меня ещё дела, поднимайся первой.' },
    { id:10, lesson:7, title:'冰箱塞得满满的', titleRu:'Холодильник полон', content:'张红：妈，看，这些苹果红红的，大大的，一定很好吃。咱们买一点儿吧！报上说，吃苹果对身体有好处，不生病。\n妈妈：水果对身体都有好处。再说，咱们家的水果还没吃完呢。\n张红：您说的是橘子吧？太酸了，别吃了吧。\n妈妈：那天是谁说的？橘子有很多维生素C，对身体有好处，结果买了四斤，没有人吃。再说，天气这么热，水果也容易坏，吃完了再买吧。\n张红：那可以放在冰箱里呀。\n妈妈：咱们家那个冰箱前两天就已经塞得满满的了。\n张红：看来该换个大冰箱了。', translation:'Чжан Хун: Мама, смотри, эти яблоки красные, большие, наверняка очень вкусные. Давай купим немного! В газете писали, что есть яблоки полезно для здоровья, не болеешь.\nМама: Фрукты все полезны для здоровья. К тому же, наши фрукты ещё не съедены.\nЧжан Хун: Вы про мандарины? Они слишком кислые, не надо их есть.\nМама: Кто это сказал? В мандаринах много витамина C, полезно для здоровья, в результате купили четыре цзиня, никто не ест. К тому же, погода такая жаркая, фрукты легко портятся, съедим — тогда и купим.\nЧжан Хун: Можно же положить в холодильник.\nМама: Наш холодильник ещё позавчера был забит до отказа.\nЧжан Хун: Похоже, пора менять большой холодильник.' },
    { id:11, lesson:8, title:'比赛很精彩', titleRu:'Отличный матч', content:'玛莎：今天的足球比赛怎么样？\n李军：非常精彩。\n玛莎：你们赢了？\n萨沙：没有。\n玛莎：那一定是输了。\n李军：也没有，二比二，踢平了。\n萨沙：都怪我，浪费了那么好的射门机会。要是踢进去，胜利就是我们的了。\n玛莎：踢平已经很不简单了。走，今天我请你们吃饭。\n萨沙：明天踢完再一块儿请吧。我有点儿累，想回宿舍洗个澡，休息一下儿。\n玛莎：明天的对手是谁？\n李军：数学系，听说挺厉害的。\n玛莎：没关系，明天我和安娜去给你们加油。\n李军：太好了！有你们在，我们一定能赢。', translation:'Маша: Как прошёл сегодняшний футбольный матч?\nЛи Цзюнь: Очень захватывающе.\nМаша: Вы выиграли?\nСаша: Нет.\nМаша: Значит, проиграли.\nЛи Цзюнь: Тоже нет, 2:2, ничья.\nСаша: Это я виноват, упустил такой хороший момент для удара. Если бы забил, победа была бы нашей.\nМаша: Ничья — уже неплохо. Пойдёмте, сегодня я угощаю.\nСаша: Давай завтра после матча вместе. Я немного устал, хочу вернуться в общежитие, принять душ и отдохнуть.\nМаша: Кто завтра соперник?\nЛи Цзюнь: Математический факультет, говорят, довольно сильные.\nМаша: Неважно, завтра мы с Анной придём вас поддержать.\nЛи Цзюнь: Отлично! С вами мы обязательно победим.' },
    { id:12, lesson:9, title:'我进不去了', titleRu:'Я не смог попасть к себе', content:'张红：李军，你的腿怎么了？为什么一拐一拐的？\n李军：瞎，别提了，都因为钥匙。\n张红：什么钥匙？\n李军：房间钥匙。我忘了带钥匙，进不去宿舍了。\n张红：那你的腿怎么这样了？\n李军：足球比赛马上要开始了，我怕来不及，就从窗户爬进去了。\n张红：你们的房间在三层，你怎么爬进去的？\n李军：我们隔壁是水房。我从水房窗户爬过去的。\n张红：那多危险啊！\n李军：还算顺利。不过往房间里跳时，一下子摔倒了，你看，就变成现在这个样子了。', translation:'Чжан Хун: Ли Цзюнь, что с твоей ногой? Почему хромаешь?\nЛи Цзюнь: Эх, не спрашивай, всё из-за ключей.\nЧжан Хун: Каких ключей?\nЛи Цзюнь: От комнаты. Я забыл взять ключ и не смог попасть в общежитие.\nЧжан Хун: А что с ногой?\nЛи Цзюнь: Футбольный матч вот-вот начнётся, я побоялся не успеть и залез через окно.\nЧжан Хун: Ваша комната на третьем этаже, как ты залез?\nЛи Цзюнь: Рядом с нами комната с водой. Я через её окно перелез.\nЧжан Хун: Это же так опасно!\nЛи Цзюнь: Всё прошло нормально. Но когда прыгал в комнату, упал и вот, видишь, что получилось.' },
    { id:13, lesson:10, title:'山上的风景美极了', titleRu:'Вид с горы прекрасен!', content:'中村：玛莎，周末去农村的旅行怎么样？\n玛莎：很不错。上午我们先参观了一所敬老院，然后参观了一所幼儿园，我们和孩子们一起唱歌、跳舞、做游戏，非常有意思。\n中村：去农民家了吗？\n玛莎：去了，我们还在农民家吃饭了呢。\n中村：后来去别的地方了吗？\n玛莎：下午我们去爬了附近的一座山，山上有古老的长城，非常雄伟。\n中村：是什么山？\n玛莎：想不起山的名字来了，听说是那个地区最高的山，有几百米高吧。\n中村：那么高，你爬得上去吗？\n玛莎：在朋友们的鼓励下，我好不容易才爬了上去。从山上往远处一看，美极了：蓝蓝的天，白白的云，红红的花，绿绿的草，小鸟在天上飞来飞去……真像一幅风景画儿。\n中村：听你这么一说，我真后悔没有去。\n玛莎：没关系，我照了很多相片，可以送给你。', translation:'Накамура: Маша, как прошла поездка в деревню на выходных?\nМаша: Очень хорошо. Утром мы сначала посетили дом престарелых, потом детский сад, мы с детьми пели, танцевали, играли — очень интересно.\nНакамура: Ходили в крестьянский дом?\nМаша: Ходили, мы ещё ели в крестьянском доме.\nНакамура: Потом пошли в другое место?\nМаша: Днём мы поднялись на соседнюю гору, на горе есть древняя Великая Китайская стена, очень величественная.\nНакамура: Что за гора?\nМаша: Не могу вспомнить название, говорят, самая высокая в том районе, несколько сотен метров.\nНакамура: Так высоко, ты смогла подняться?\nМаша: С поддержкой друзей я с трудом поднялась. С горы посмотрела вдаль — красота необыкновенная: синее небо, белые облака, красные цветы, зелёная трава, птицы летают в небе... прямо как пейзаж.\nНакамура: Слушая тебя, я жалею, что не поехал.\nМаша: Ничего, я много фотографий сделала, могу тебе дать.' },
    { id:14, lesson:11, title:'西红柿炒鸡蛋', titleRu:'Яичница с помидорами', content:'张红：玛莎，你不是想学做中国菜吗？今天我就教你做一个中国的家常菜。\n玛莎：“家常菜”是什么菜呀？\n张红：家常菜就是中国人平时在家里常吃的菜。\n玛莎：好啊，我就想学做在家里吃的菜。对了，做什么菜呀？\n张红：西红柿炒鸡蛋，又好吃又好学，咱们一起做怎么样？\n玛莎：行，我做什么？\n张红：来，把鸡蛋打到这个碗里，用筷子搅拌均匀，再把西红柿切成小块儿。\n玛莎：你看这么大行吗？\n张红：挺好。你把火点着，把锅放在火上，往锅里倒点儿油，把鸡蛋放进去炒一下儿，倒出来。再放一点儿油，把西红柿放进锅里炒熟，把炒好的鸡蛋放进去，别忘了加点儿白糖，最后再加点儿盐。好了，尝尝，怎么样？\n玛莎：嗯，又好看又好吃，真不错！\n张红：是啊，这就是中国菜的特点：看起来漂亮，闻起来很香，吃起来好吃。\n玛莎：就是做起来不太容易。', translation:'Чжан Хун: Маша, ты же хотела научиться готовить китайские блюда? Сегодня я научу тебя готовить домашнее китайское блюдо.\nМаша: А что такое "домашнее блюдо"?\nЧжан Хун: Домашнее блюдо — это то, что китайцы обычно едят дома.\nМаша: Хорошо, я как раз хочу научиться готовить домашнюю еду. Кстати, какое блюдо?\nЧжан Хун: Яичница с помидорами, вкусно и легко, давай вместе приготовим?\nМаша: Давай, что мне делать?\nЧжан Хун: Разбей яйца в эту миску, размешай палочками, потом нарежь помидоры кубиками.\nМаша: Вот такого размера нормально?\nЧжан Хун: Отлично. Зажги огонь, поставь сковороду на огонь, налей немного масла, положи яйца, обжарь, вынь. Налей ещё немного масла, положи помидоры, обжарь до готовности, положи обжаренные яйца, не забудь добавить немного сахара, в конце добавь соли. Готово, попробуй, как?\nМаша: Ммм, и красиво, и вкусно, действительно неплохо!\nЧжан Хун: Да, это особенность китайской кухни: выглядит красиво, пахнет ароматно, на вкус вкусно.\nМаша: Только готовить не очень легко.' },
    { id:15, lesson:12, title:'搬家', titleRu:'Переезд', content:'萨沙：劳驾，请把这些纸箱子搬到那儿，注意按纸箱子上的号码放好，不要把顺序弄乱了。\n工人：好。电视放在哪儿？\n萨沙：先放在桌子上吧。小心，很重，别把手碰了。\n工人：先生，您的东西都在这儿了。\n萨沙：谢谢，你们辛苦了。\n（在电话里）\n工作人员：保洁公司。需要我们为您服务吗？\n萨沙：我刚搬完家，家里比较脏，想请你们来收拾一下儿。\n工作人员：好，请把您的姓名、地址和电话号码告诉我们。先生贵姓？\n萨沙：免贵，我叫萨沙，住在华美小区3号楼2单元1603号，我的手机号码是13691350769。你们明天下午两点来，好吗？\n工作人员：好，明天下午见。', translation:'Саша: Будьте добры, перенесите эти коробки туда, обратите внимание, расставьте по номерам на коробках, не перепутайте порядок.\nРабочий: Хорошо. Куда поставить телевизор?\nСаша: Пока на стол. Осторожно, он тяжёлый, не ударьте руку.\nРабочий: Господин, все ваши вещи здесь.\nСаша: Спасибо, вы хорошо потрудились.\n(По телефону)\nСотрудник: Клининговая компания. Нужны наши услуги?\nСаша: Я только что переехал, дома довольно грязно, хочу попросить вас прибраться.\nСотрудник: Хорошо, продиктуйте ваше имя, адрес и номер телефона. Как ваша фамилия?\nСаша: Моя фамилия не из благородных, меня зовут Саша, живу в микрорайоне Хуамэй, дом 3, подъезд 2, квартира 1603, мой номер 13691350769. Приходите завтра в два часа дня, хорошо?\nСотрудник: Хорошо, до завтра.' },
    { id:16, lesson:13, title:'一封信', titleRu:'Письмо', content:'刘老师：\n您好！\n您的信我收到了，但是因为忙，也因为我的汉语不好，过了这么久才给您写信，请您原谅。您一切都好吧？\n转眼我到中国已经半年多了。去年9月刚来中国时，我听不懂也看不懂，也没有朋友，非常难过。现在我的汉语水平有了一定程度的提高，也交了不少朋友，不但有中国的，而且还有世界各地的，我们一起学习，互相帮助，每天都过得很开心。汉语学习也越来越有意思了。开始上课时，我不习惯老师说汉语，只能听懂百分之四五十，因为我没学过简化字，有很多不认识。但是我每天努力学习，不懂就问老师和同学，所以我的进步很快。现在我已经能用汉语进行一般的会话了，上课也能听懂四分之三了。最重要的是，我越来越喜欢汉语了，我想将来找一个和中国有关系的工作。\n我现在的生活也基本没问题了。刚来时我不习惯吃中国菜，觉得油太多，也看不懂菜单，只好常常去吃麦当劳。现在我不但习惯了吃中餐，还会做几个地道的中国菜呢。等我回去以后一定做给你们吃。\n我以前打算今年8月回国，但是我现在决定延长一年，到明年8月再回国。在这一年里，我想多了解一点儿中国文化，多交一些朋友。\n老师的工作顺利吗？祝您身体健康！\n您的学生：玛莎\n4月10日', translation:'Уважаемый учитель Лю!\nЗдравствуйте!\nВаше письмо я получила, но из-за занятости и потому что мой китайский ещё не очень хорош, только сейчас вам пишу, простите меня. У вас всё хорошо?\nНезаметно я в Китае уже больше полугода. Когда я только приехала в сентябре прошлого года, я не понимала на слух и не могла читать, у меня не было друзей, мне было очень грустно. Сейчас мой китайский немного улучшился, я завела много друзей, не только китайцев, но и со всего мира, мы вместе учимся, помогаем друг другу, каждый день проходит весело. Учить китайский становится всё интереснее. В начале занятий я не привыкла, что учитель говорит по-китайски, понимала только 40-50 процентов, потому что не учила упрощённые иероглифы, многие не знала. Но я каждый день усердно училась, если не понимала — спрашивала учителя и однокурсников, поэтому быстро добилась прогресса. Сейчас я уже могу вести обычную беседу на китайском, на занятиях понимаю три четверти. Самое главное — мне всё больше нравится китайский, я хочу в будущем найти работу, связанную с Китаем.\nСейчас у меня в жизни тоже в основном всё хорошо. Когда только приехала, я не привыкла к китайской еде, казалось, слишком много масла, и не понимала меню, поэтому часто ходила в McDonald\'s. Теперь я не только привыкла к китайской еде, но и умею готовить несколько аутентичных китайских блюд. Когда вернусь, обязательно приготовлю для вас.\nРаньше я планировала вернуться в августе этого года, но сейчас решила продлить ещё на год, до августа следующего года. За этот год я хочу больше узнать о китайской культуре, завести больше друзей.\nКак ваша работа? Желаю вам крепкого здоровья!\nВаша ученица: Маша\n10 апреля' },
    { id:17, lesson:14, title:'成功需要多长时间', titleRu:'Сколько времени надо, чтобы добиться успеха?', content:'萨沙：画家朋友，听说你在美术比赛中得了第一名。请给我们介绍一下儿你是怎么成功的，好吗？\n画家：怎么说呢？很多人以为成功是很难的事情，其实，只要坚持努力，理想就一定能实现。\n萨沙：这话是什么意思呢？\n画家：我上初中的时候才开始喜欢画画儿。从那时候开始一直到高中一年级，每天大概只用一个小时画画儿。\n萨沙：那么，四年里，你画画儿的时间大概只有六十一天啊。高中二年级以后，你没有再画吗？\n画家：高中二年级和三年级的时候，因为准备考大学，我暂时停止了画画儿。上大学以后，才又重新拿起画笔。大学四年里，我每天也只用一个小时画画儿。\n萨沙：四年里，画画儿的时间大概也是六十一天。大学毕业以后呢？\n画家：大学毕业后，我当了三年大学老师。这三年里，我每天大概花三个小时画画儿。三年里，画画儿的时间大概是一百三十七天。\n萨沙：后来呢？\n画家：后来我辞去了大学的工作，去全国各地游览了三年，每天用八个小时画画儿。三年里，画画儿的时间正好是三百六十五天。\n萨沙：这三年，你画画儿的时间比较多。\n画家：是的。后来我回到北京，专门画了三年画儿，每天用十个小时画画儿。三年里，画画儿的时间大概是四百六十五天。然后，在这次比赛中，我得了这个大奖。\n萨沙：从你小时候对画画儿产生兴趣，得到大奖，你花在画画儿上的时间是多少呢？我们算一下儿：六十一天加六十一天加一百三十七天加三百六十五天加四百六十五天，等于一千零八十九天。大概只有三年！\n画家：是啊，其他的时间，我都在做与画画儿无关的事。所以我说，成功不需要多少时间。你同意我的看法吗？\n萨沙：你真棒！祝贺你。', translation:'Саша: Друг-художник, говорят, ты занял первое место в художественном конкурсе. Расскажи нам, как ты добился успеха, хорошо?\nХудожник: Как сказать? Многие думают, что успех — это трудно, на самом деле, если упорно трудиться, мечта обязательно сбудется.\nСаша: Что это значит?\nХудожник: Я начал любить рисовать в средней школе. С того времени и до первого класса старшей школы я рисовал примерно час в день.\nСаша: Значит, за четыре года ты рисовал всего около шестидесяти одного дня. После второго класса старшей школы ты больше не рисовал?\nХудожник: Во втором и третьем классе старшей школы, из-за подготовки к экзаменам, я временно перестал рисовать. После поступления в университет снова взялся за кисть. За четыре года университета я тоже рисовал только час в день.\nСаша: За четыре года тоже примерно шестьдесят один день. А после университета?\nХудожник: После университета я три года работал преподавателем. За эти три года я рисовал примерно три часа в день. За три года — примерно сто тридцать семь дней.\nСаша: А потом?\nХудожник: Потом я уволился из университета, три года путешествовал по стране, рисовал по восемь часов в день. За три года — ровно триста шестьдесят пять дней.\nСаша: За эти три года ты рисовал довольно много.\nХудожник: Да. Потом я вернулся в Пекин, три года специально рисовал, по десять часов в день. За три года — примерно четыреста шестьдесят пять дней. И вот на этом конкурсе я получил главный приз.\nСаша: С того времени, как ты в детстве заинтересовался рисованием, до получения главного приза, сколько времени ты потратил на рисование? Давай посчитаем: 61 + 61 + 137 + 365 + 465 = 1089 дней. Всего около трёх лет!\nХудожник: Да, остальное время я занимался делами, не связанными с рисованием. Поэтому я говорю, что для успеха не нужно много времени. Ты согласен с моим мнением?\nСаша: Ты молодец! Поздравляю.' },
    { id:18, lesson:16, title:'从哪一头儿吃香蕉', titleRu:'С какой стороны есть банан?', content:'一个朋友对我说过一句话，给我留下了深刻的印象。她说：“有些人吃香蕉总是从尾巴开始剥，有些人总是从细头儿开始剥，差别很大。”她的话给了我很大的启发。\n如果已经是一种习惯，一个人就很难改变他剥香蕉的方式。\n一个戒烟的人，他戒了一天烟，难受极了，他想：我才戒了一天烟，就这么难。天哪，如果我还能活1万天的话，就还要受9999天的罪，算了吧！他戒烟失败。但是，如果换个想法：我第一天戒烟就成功了，真不错！如果我还能活1万天的话，坚持下去，后面的9999天就从成功开始，多好！这样，他就能慢慢地把烟戒掉了。\n其实，这里有一个最简单的道理：遇到任何事情，我们都可以试试换个角度去想。很多事情不是必须那么做，或者必须这么做的。\n香蕉，当然是可以从两头儿吃的！', translation:'Одна подруга сказала мне фразу, которая оставила глубокое впечатление. Она сказала: "Некоторые люди всегда чинят банан с хвостика, некоторые — с тонкого конца, разница большая." Её слова дали мне большое вдохновение.\nЕсли это уже привычка, человеку трудно изменить способ чистки банана.\nЧеловек, бросающий курить, продержался один день, ему было очень тяжело, он подумал: я только один день не курю, и уже так трудно. Боже, если мне осталось жить 10 000 дней, то придётся мучиться ещё 9999 дней, ладно, брошу! Он потерпел неудачу. Но если подумать иначе: я первый день бросил курить — и сразу успех, отлично! Если мне осталось жить 10 000 дней, буду держаться, и оставшиеся 9999 дней начнутся с успеха, как хорошо! Так он постепенно бросит курить.\nНа самом деле, здесь есть простейшая истина: сталкиваясь с любым делом, мы можем попробовать посмотреть на него под другим углом. Многие вещи не обязательно делать так или иначе.\nБанан, конечно, можно есть с двух концов!' },
    { id:19, lesson:17, title:'李军的日记', titleRu:'Дневник Ли Цзюня', content:'五年前的暑假，我高中毕业了。那时候，我们同学约好，五年后的暑假一起回母校聚会。\n这五年里，我们大家虽然也经常联系，但是除了发发电子邮件、打电话，从来也没有见过面。所以，能够聚一聚，我们都非常高兴。离聚会的时间还差一个多月，我们就在网上讨论聚会的计划和安排了。最后，我们决定在7月11日——就是五年前我们离开学校的日子，大家一起回母校。\n说实话，没见面以前，我有些担心：已经五年没见面了，大家一定有很多变化，如果找不到共同的话题，该怎么办？但是，没想到，大家见面后，不但不觉得陌生，而且似乎比五年前还亲热，问好、握手，一下子就回到了过去。第一天的晚上，我们一边喝酒，一边回忆做过的坏事、傻事，痛痛快快地一直聊到天亮。\n两天的时间很快就过去了。我们在宿舍楼、教室、操场、食堂、图书馆、体育馆，每一个曾经去过的地方，都照了相、合了影，作为留念。\n这真是一次愉快的聚会！', translation:'Пять лет назад на летних каникулах я окончил школу. Тогда мы с одноклассниками договорились, что через пять лет на летних каникулах вместе вернёмся в родную школу на встречу.\nЗа эти пять лет мы, хоть и часто общались, но кроме электронных писем и звонков, никогда не виделись. Поэтому возможности собраться мы все очень обрадовались. До встречи оставалось ещё больше месяца, мы обсуждали в интернете планы и организацию. В конце концов мы решили 11 июля — день, когда мы пять лет назад покинули школу, — всем вместе вернуться в альма-матер.\nЧестно говоря, до встречи я немного волновался: пять лет не виделись, все наверняка сильно изменились, если не найдём общих тем, что делать? Но, к удивлению, после встречи мы не только не почувствовали себя чужими, а, кажется, стали ещё ближе, чем пять лет назад, здоровались, жали руки и сразу вернулись в прошлое. В первый вечер мы, попивая вино, вспоминали плохие и глупые поступки, весело проболтали до рассвета.\nДва дня пролетели быстро. В общежитии, аудиториях, на спортплощадке, в столовой, библиотеке, спортзале — везде, где мы когда-то бывали, мы фотографировались, делали совместные снимки на память.\nЭто была действительно радостная встреча!' },
    { id:20, lesson:18, title:'我看过京剧', titleRu:'Я видела пекинскую оперу', content:'昨天晚上，我去看了一场京剧。演员的表演很精彩，可是一句台词我也没听明白，演出的内容是什么，我完全不知道。\n一年以前，我曾经看过一场京剧，当时，我也什么都没听懂。但是，我可以原谅自己，因为那时候我刚开始学习汉语，知道的词很少，而且听力也不太好，和老师、辅导聊天儿的时候，也经常听不懂。\n现在我学汉语一年多了，词汇量增加了很多，已经可以用汉语进行一般的会话，可以看懂电视节目，听懂新闻广播了。我一直很满意，以为自己的汉语已经取得了很大的进步，可是为什么看京剧时还是一句也听不懂呢？难道我的汉语水平还是那么差吗？\n今天正在苦恼的时候，我的一个中国朋友来玩儿。她告诉我说，京剧的台词不是用现代普通话唱的，大部分中国人也听不懂。\n原来是这样！看起来，虽然对中国的政治、经济、教育和社会情况，我比较了解，但是我对京剧艺术等中国文化方面的知识，还是了解得太少了。', translation:'Вчера вечером я ходила на пекинскую оперу. Игра актёров была превосходной, но я не поняла ни одной реплики, содержание представления я совершенно не знала.\nГод назад я тоже была на пекинской опере, тогда я тоже ничего не поняла. Но я могла себя простить, потому что тогда только начала учить китайский, знала мало слов, и аудирование было не очень, даже в разговоре с учителем и репетитором часто не понимала.\nСейчас я учу китайский больше года, словарный запас намного увеличился, уже могу вести обычную беседу, понимаю телепередачи, новости по радио. Я всегда была довольна, думала, что добилась большого прогресса, но почему же в пекинской опере я не понимаю ни слова? Неужели мой китайский всё ещё так плох?\nСегодня, когда я мучилась, пришла моя китайская подруга. Она сказала, что реплики в пекинской опере поются не на современном путунхуа, большинство китайцев тоже не понимают.\nОказывается, вот в чём дело! Похоже, хотя я неплохо знаю политику, экономику, образование и общество Китая, но об искусстве пекинской оперы и других аспектах китайской культуры я знаю слишком мало.' },
    { id:21, lesson:19, title:'如果有一天……', titleRu:'Если однажды…', content:'如果有一天，你发现母亲的厨房不再像以前那么干净了；如果有一天，你发现母亲做的菜太咸太难吃；如果有一天，你发现父亲看电视看着看着睡着了；如果有一天，你发现父母不再爱吃脆脆的蔬菜水果了；如果有一天，你发现父母喜欢喝稀饭了；如果有一天，你发现他们反应慢了；如果有一天，你发现吃饭的时候他们总是咳嗽……\n如果有这么一天，我要告诉你：你的父母真的已经老了，需要别人照顾了。\n每个人都会老。父母比我们先老，我们应该照顾他们，关心他们。他们可能会很多事都做不好，如果房间有味儿，可能他们自己也闻不到，请千万不要嫌他们脏或嫌他们臭。他们不再爱洗澡的时候，请一定抽空儿帮他们洗洗身体，因为他们自己可能洗不干净；我们在享受食物的时候，请给他们准备一小碗容易吃的，因为有些东西他们不爱吃可能是因为牙齿咬不动了。\n从我们出生开始，父母就在不停地忙碌，教我们生活的基本能力，把人生的经验告诉我们，还让我们读书学习……所以，如果有一天，他们真的动不了了，我们要记住，看父母就是看自己的未来。如果有一天，你像他们一样老时，你希望怎么过？', translation:'Если однажды ты обнаружишь, что кухня матери уже не такая чистая, как раньше; если однажды ты обнаружишь, что еда, приготовленная матерью, слишком солёная и невкусная; если однажды ты обнаружишь, что отец заснул, глядя телевизор; если однажды ты обнаружишь, что родители больше не любят хрустящие овощи и фрукты; если однажды ты обнаружишь, что родители полюбили жидкую кашу; если однажды ты обнаружишь, что они стали медленно реагировать; если однажды ты обнаружишь, что во время еды они всё время кашляют...\nЕсли такой день наступит, я скажу тебе: твои родители действительно постарели, им нужен уход.\nКаждый человек стареет. Родители стареют раньше нас, мы должны заботиться о них, беспокоиться о них. Они могут многое делать плохо, если в комнате есть запах, они могут его не чувствовать, пожалуйста, ни в коем случае не считай их грязными или вонючими. Когда они перестанут любить мыться, обязательно выкрои время помочь им помыться, потому что сами они могут не отмыться как следует; когда мы наслаждаемся едой, приготовь им маленькую пиалу легко жующейся еды, потому что некоторые продукты они не любят, возможно, из-за того, что зубы уже не жуют.\nС самого нашего рождения родители постоянно хлопочут, учат нас основным жизненным навыкам, передают нам жизненный опыт, заставляют нас учиться... Поэтому, если однажды они действительно не смогут двигаться, мы должны помнить: глядя на родителей, ты видишь своё будущее. Если однажды ты состаришься, как они, как бы ты хотел жить?' },
    { id:22, lesson:21, title:'黄金周：痛痛快快玩儿一周', titleRu:'«Золотая неделя»: весело отдохнуть неделю', content:'我的老家是河北省的一个小城。二十七岁以前，姐姐没有去过河北省以外的地方。那时候，姐姐的假期很少，只有春节才能连着休息六七天。可是，春节是全家团圆的日子，她哪儿也不能去。\n1997年，我大学毕业，留在北京一家公司当推销员，能够全国各地到处跑，姐姐很羡慕：“我上学的时候没有钱，工作以后又没有时间。要是能有一个长假期，我一定要跑遍中国。”\n没想到，姐姐的这个愿望很快就实现了。1999年，政府开始实行“黄金周”休假制度：每年的春节、“五一”和“十一”，全国放假三天，加上周末，有整整一周的时间！对辛苦工作的人来说，有这么一个长长的假期，真是太难得了。\n黄金周还没到，姐姐就开始做旅行的准备工作，一方面决定去什么地方，另一方面再联系好旅行社，只等休假开始，马上就出发。几年过去，姐姐已经去过了很多地方：去海边晒过太阳，去草原骑过大马，看过黄河，游过长江……\n“外面的世界真精彩！”每次旅行回来，姐姐都会开心地说这么一句。\n现在她已经制订了一个大计划：一个省一个省地看，一个地方一个地方地走，直到走遍中国，老得走不动了才停。\n我的姐姐，一个普通的青年人，因为有这样一个长假期，生活变得越来越丰富。我愿她身体健康，跑遍中国以后，再去外国看一看。', translation:'Моя родина — маленький город в провинции Хэбэй. До двадцати семи лет сестра не бывала за пределами провинции Хэбэй. Тогда у сестры было мало отпусков, только на Праздник весны можно было отдохнуть шесть-семь дней подряд. Но Праздник весны — время семейного воссоединения, она никуда не могла поехать.\nВ 1997 году я окончил университет и остался работать в пекинской компании торговым агентом, мог ездить по всей стране, сестра мне завидовала: "Когда я училась, не было денег, а после работы нет времени. Если бы был длинный отпуск, я обязательно объехала бы весь Китай."\nНеожиданно желание сестры скоро исполнилось. В 1999 году правительство ввело систему "золотых недель": каждый год на Праздник весны, 1 мая и 1 октября по всей стране три выходных дня, плюс выходные — целая неделя! Для уставших от работы людей такой длинный отпуск — большая редкость.\nЕщё до наступления "золотой недели" сестра начала готовиться к поездке: с одной стороны, решала, куда поехать, с другой — связывалась с турагентством, ждала начала отпуска и сразу отправлялась. Прошло несколько лет, сестра уже побывала во многих местах: загорала на берегу моря, скакала на лошади в степи, видела Хуанхэ, плавала по Янцзы...\n"Внешний мир так прекрасен!" — каждый раз, возвращаясь из поездки, сестра радостно говорила эту фразу.\nСейчас она составила большой план: смотреть провинцию за провинцией, идти место за местом, пока не объедет весь Китай, и остановится только когда состарится и не сможет ходить.\nМоя сестра, обычная молодая женщина, благодаря такому длинному отпуску, её жизнь становится всё богаче. Я желаю ей крепкого здоровья, объехать Китай, а потом посмотреть и заграницу.' },
    { id:23, lesson:22, title:'一个电话', titleRu:'Один звонок', content:'我儿子上初中三年级的时候，他父亲去世了。父亲去世后，他的性格有了很大的变化，学习成绩一天比一天差。我想了各种办法帮助他，但是我越想帮他，他离我越远，不愿意和我谈话。学期结束时，他已经缺课九十五次，物理、化学和外语考试都不及格。这样看来，他很有可能连初中都毕不了业。我很着急，用了各种各样的办法，但是，批评和表扬都没有用。他还是老样子。\n有一天，我正在上班，突然接到一个电话。一个男人说他是学校的辅导老师：“我想和您谈谈张亮缺课的情况。”\n我把自己的苦恼和对儿子的爱都告诉了这个陌生人。最后我说：“我爱儿子，我不知道该怎么办。看着他那个样子，我很难过。我想了各种办法，想让他重新喜欢学校，但是……唉，这一切都没有作用，我已经没有办法了。”\n我说完以后，电话那头儿没有回答。过了一会儿，那位老师说：“谢谢您抽时间和我谈话。”说完就挂上了电话。\n儿子的下一次成绩单来了，我高兴地看到他的学习有了很大的进步。\n一年过去了，儿子上了高中。在一次家长会上，老师表扬了他的进步。\n回家的路上，儿子问我：“妈妈，还记得一年前那位给您打电话的辅导老师吗？”\n我点了点头。\n“那是我。”儿子说，“我本来是想和您开个玩笑的，但是听了您的话，我心里很难过。那时候，我才知道，爸爸去世了，您多不容易啊！我下决心，一定要成为您的骄傲。”', translation:'Когда мой сын учился в третьем классе средней школы, его отец умер. После смерти отца его характер сильно изменился, успеваемость с каждым днём становилась всё хуже. Я пробовала разные способы помочь ему, но чем больше я старалась, тем дальше он от меня отдалялся, не хотел со мной разговаривать. К концу семестра он пропустил уже 95 занятий, экзамены по физике, химии и иностранному языку не сдал. Похоже, он вполне мог даже не окончить среднюю школу. Я очень волновалась, использовала всевозможные методы, но критика и похвала не помогали. Он оставался прежним.\nОднажды, когда я была на работе, мне вдруг позвонили. Мужчина сказал, что он школьный психолог: "Я хочу поговорить с вами о пропусках Чжан Ляна."\nЯ рассказала незнакомцу о своём горе и любви к сыну. В конце я сказала: "Я люблю сына, не знаю, что делать. Глядя на него, мне очень больно. Я пробовала разные способы, хотела, чтобы он снова полюбил школу, но... увы, всё бесполезно, у меня уже нет сил."\nПосле моих слов на том конце провода не ответили. Через некоторое время учитель сказал: "Спасибо, что нашли время поговорить со мной." И повесил трубку.\nПришёл следующий табель сына, я с радостью увидела, что его учёба значительно улучшилась.\nПрошёл год, сын пошёл в старшую школу. На одном родительском собрании учитель похвалил его за успехи.\nПо дороге домой сын спросил меня: "Мама, помнишь того психолога, который звонил тебе год назад?"\nЯ кивнула.\n"Это был я." — сказал сын. — "Я сначала хотел пошутить, но, услышав твои слова, мне стало очень больно. Тогда я понял, как трудно тебе после смерти папы! Я решил, что обязательно стану твоей гордостью."' },
    { id:24, lesson:23, title:'笑话', titleRu:'Анекдоты', content:'（一）我姓范\n上大学的时候，班上的同学都是从不同的地方考来的，连姓都没有一样的。记得刚开学的时候，班主任叫同学们一起聚餐，既作为新学期第一次班会，也算是大家的第一次沟通。\n吃饭前，班主任说：“同学们刚来报到，互相还不熟悉，我们先做个自我介绍吧。”于是，从班主任开始，大家一个一个地介绍自己的姓名、从什么地方来等等。紧挨着班主任的同学姓汤，他开玩笑说：“就是肉丝汤的汤。”接着，旁边的同学介绍自己姓蔡，大家一边笑一边说：“不是蔬菜的菜吧？如果是，我们这顿饭就不用点菜了。”正说着，一个同学不好意思地站了起来，小声说：“我姓范……”大家终于忍不住了，哈哈大笑起来。\n（二）改变不了\n从前，有一个女人，别人送她一个外号——“馋老婆”。因为她太爱吃，不管说什么，都得说吃的东西。\n有一天，丈夫准备去参加一个宴会，让她看看天气怎么样。她开门看了看，进了屋子就说：“哎呀，天正下雪，大得很呢！雪白得就像牛奶一样。”\n“雪下得有多厚？”\n“有烙饼那么厚。”\n丈夫一看馋老婆的老毛病又犯了，就打了她一巴掌，说：“你以后少说吃的东西！再说的话，我非打你不可。”馋老婆摸着脸说：“我记住了，再也不敢了。你好狠心啊，把我的脸打得像馒头似的。”\n女儿一看妈妈挨了打，就哭了。馋老婆抱着孩子，一边给孩子擦眼泪一边说：“好孩子，别哭了。你哭的声音就像吃面包。”', translation:'（一）Моя фамилия Фань\nКогда я учился в университете, все однокурсники были из разных мест, даже фамилии не повторялись. Помню, в начале учебного года классный руководитель устроил совместный обед — и как первое собрание, и как первое знакомство.\nПеред едой классный руководитель сказал: "Вы только что приехали, ещё не знакомы, давайте представимся." И вот, начиная с классного руководителя, все по очереди называли имя, откуда приехали и т.д. Сосед по столу справа от руководителя носил фамилию Тан, он пошутил: "Это как в супе с мясной соломкой — тан." Потом сосед представился по фамилии Цай, все засмеялись: "Не овощ ли?" Если так, то нам не нужно заказывать овощи." Только он это сказал, как один студент смущённо встал и тихо сказал: "Моя фамилия Фань..." Все наконец не выдержали и громко расхохотались.\n（二）Не переделать\nРаньше была одна женщина, которой дали прозвище "обжора". Потому что она очень любила поесть, что бы ни говорила — всё сводилось к еде.\nОднажды муж собирался на банкет и попросил её посмотреть, какая погода. Она открыла дверь, выглянула, вернулась в комнату и сказала: "Ой, идёт снег, большой! Белый, как молоко."\n"Какой толщины снег?"\n"Толщиной с лепёшку."\nМуж увидел, что старая привычка обжоры снова дала о себе знать, дал ей пощёчину и сказал: "Впредь поменьше говори о еде! Ещё раз — я тебя непременно побью." Обжора потрогала лицо и сказала: "Я запомнила, больше не буду. Какой же ты жестокий, избил меня так, что лицо стало как пампушка."\nДочка увидела, что маму ударили, и заплакала. Обжора обняла ребёнка, вытирая слёзы, и сказала: "Хорошая девочка, не плачь. Ты плачешь так, будто ешь хлеб."' },
    { id:25, lesson:24, title:'人生', titleRu:'Жизнь человека', content:'从前，有一位很有名的哲学家，迷倒了不少女孩子。\n有一天，一个姑娘来敲他的门说：“让我做你的妻子吧！错过我，你就找不到比我更爱你的女人了！”\n哲学家虽然很喜欢她，但仍然回答说：“让我考虑考虑。”\n然后，哲学家用他研究哲学问题的精神，把结婚和不结婚的好处与坏处分别列了出来。他发现，这个问题有些复杂，好处和坏处差不多一样多，真不知道该怎么决定。\n最后，他终于得出一个结论：人如果在选择面前无法做决定的话，应该选择没有经历过的那一个。\n哲学家去找那个姑娘，对她的父亲说：“您的女儿呢？我考虑清楚了，我决定娶她！”\n但是，他被姑娘的父亲挡在了门外。他得到的回答是：“你来晚了十年，我女儿现在已经是三个孩子的妈妈了！”\n哲学家几乎不能相信自己的耳朵，他非常难过。\n两年后，他得了重病。临死前，他把自己所有的书都扔进火里，只留下一句话：“如果把人生分成两半，前半段的人生哲学是‘不犹豫’，后半段的人生哲学是‘不后悔’。”', translation:'Раньше был один известный философ, который очаровал немало девушек.\nОднажды одна девушка постучала в его дверь и сказала: "Позволь мне стать твоей женой! Упустишь меня — не найдёшь женщины, которая любила бы тебя больше!"\nФилософ, хотя она ему очень нравилась, всё же ответил: "Дай мне подумать."\nЗатем философ с присущим ему духом исследования философских проблем выписал отдельно плюсы и минусы женитьбы и безбрачия. Он обнаружил, что вопрос довольно сложный, плюсов и минусов примерно одинаково, и никак не мог решить.\nНаконец он пришёл к выводу: если человек не может сделать выбор, он должен выбрать тот путь, который ещё не испытывал.\nФилософ пошёл к той девушке, сказал её отцу: "Где ваша дочь? Я всё обдумал, я решил на ней жениться!"\nНо отец девушки остановил его у двери. Он получил ответ: "Ты опоздал на десять лет, моя дочь сейчас мать троих детей!"\nФилософ почти не поверил своим ушам, ему было очень больно.\nЧерез два года он тяжело заболел. Перед смертью он бросил все свои книги в огонь, оставив только одну фразу: "Если разделить жизнь на две половины, философия первой половины — \"не колебаться\", философия второй половины — \"не сожалеть\"."' },
    { id:26, lesson:25, title:'点心小姐', titleRu:'Кондитерша', content:'上大学的时候，我在一家商店里打工，负责卖点心和咖啡。在这家商店附近，有一个公共汽车站，所以商店的生意很好。每天我都早早地收拾好桌子，摆好椅子，耐心地等着客人来。\n每天下午四点钟左右，总有一大群中小学生来这儿喝咖啡。\n过了一段时间以后，我渐渐地和他们熟了起来，他们也喜欢和我聊天儿。年纪大一些的女孩子，总是悄悄地给我讲她们的男朋友；较小一点儿的，会告诉我校园里的一些事情。他们一边吃一边聊，一直等到公共汽车开来了，才高高兴兴地离开。\n我和他们相处得很好，就像是很亲密的朋友。有人丢了车票，我就会替他买一张。当然，第二天他就会把钱还给我。汽车来晚了，他们还会用店里的电话告诉父母一切都好，让他们放心。\n一个星期天的下午，店里来了一位看起来很严肃的先生。我问他：“有什么事吗？”他淡淡一笑，说：“我是来向你表示感谢的。我知道我的孩子和点心小姐在一起时，他们是安全的。你很了不起，谢谢你！”\n于是我有了一个外号，就是“点心小姐”。\n又有一天，我在店里接到一个电话，是一位夫人打来的，声音听起来有些着急：“我在找我的双胞胎女儿，她们还没有回家。她们是不是在你的店里？”\n“对，她们是在我这儿，要我替您捎个话儿吗？”\n“好，好，那就太感谢你了。”\n几年以后，我离开了这家商店。后来，我有了自己的孩子。我发现他们也常常得到别人的帮助。有一天深夜，一位公共汽车司机一直陪着我的女儿，直到我开车去接她。\n于是，我知道，她也遇到了一位真正的“点心小姐”。', translation:'Когда я училась в университете, я подрабатывала в магазине, продавала пирожные и кофе. Рядом с магазином была автобусная остановка, поэтому торговля шла хорошо. Каждый день я рано убирала столы, расставляла стулья и терпеливо ждала посетителей.\nКаждый день около четырёх часов дня сюда приходила большая группа школьников выпить кофе.\nЧерез некоторое время я постепенно с ними познакомилась, они тоже полюбили со мной болтать. Девочки постарше всегда тихонько рассказывали мне о своих парнях; те, что помладше, рассказывали о школьных делах. Они ели и болтали, ждали, пока придёт автобус, и только тогда радостно уходили.\nМы хорошо ладили, как близкие друзья. Если кто-то терял билет, я покупала ему новый. Конечно, на следующий день он возвращал мне деньги. Если автобус задерживался, они звонили из магазина родителям, что всё хорошо, чтобы те не волновались.\nОднажды в воскресенье днём в магазин зашёл очень строгий на вид господин. Я спросила: "Что-нибудь нужно?" Он слегка улыбнулся и сказал: "Я пришёл выразить вам благодарность. Я знаю, что когда мои дети с кондитершей, они в безопасности. Вы замечательная, спасибо!"\nТак у меня появилось прозвище "кондитерша".\nЕщё однажды в магазине мне позвонила одна дама, голос звучал взволнованно: "Я ищу своих дочерей-близнецов, они ещё не вернулись домой. Они случайно не у вас в магазине?"\n"Да, они у меня, передать им что-нибудь?"\n"Хорошо, хорошо, большое спасибо."\nЧерез несколько лет я ушла из магазина. Потом у меня появились свои дети. Я заметила, что им тоже часто помогают другие. Однажды поздно ночью водитель автобуса оставался с моей дочерью, пока я не приехала за ней.\nТогда я поняла, что она тоже встретила настоящую "кондитершу".' },
];

// --- LocalStorage keys ---
const LS_KEY = 'boya2_trainer_state';

/* =========================================================================
   STORAGE
   ========================================================================= */
function loadState() {
    try {
        const saved = localStorage.getItem(LS_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.stats) State.stats = { ...State.stats, ...parsed.stats };
            if (parsed.settings) State.settings = { ...State.settings, ...parsed.settings };
        }
    } catch (e) { console.warn('Failed to load state', e); }
}
function saveState() {
    try {
        localStorage.setItem(LS_KEY, JSON.stringify({
            stats: State.stats,
            settings: State.settings,
        }));
    } catch (e) { console.warn('Failed to save state', e); }
}

/* =========================================================================
   UTILITY FUNCTIONS
   ========================================================================= */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function getLessons() {
    const lessons = new Set(VOCAB.map(v => v.lesson));
    return [...lessons].sort((a, b) => a - b);
}
function getTopics() {
    const topics = new Set(VOCAB.map(v => v.topic));
    return [...topics].sort();
}
function getWordsByLesson(lesson) {
    return VOCAB.filter(v => v.lesson === lesson);
}
function getWordsByTopic(topic) {
    return VOCAB.filter(v => v.topic === topic);
}
function findWordByChinese(chinese) {
    return VOCAB.find(v => v.chinese === chinese) || null;
}
function showToast(msg, duration = 2000) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
}
function formatDate(date) {
    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function applyTheme() {
    const s = State.settings;
    let theme = s.theme;
    if (theme === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme() {
    const order = ['light', 'dark', 'auto'];
    const idx = order.indexOf(State.settings.theme);
    State.settings.theme = order[(idx + 1) % order.length];
    applyTheme();
    saveState();
    showToast('Тема: ' + State.settings.theme);
}
function applySize() {
    document.documentElement.setAttribute('data-size', State.settings.size === 'normal' ? '' : State.settings.size);
}
function toggleSize() {
    const order = ['normal', 'large', 'compact'];
    const idx = order.indexOf(State.settings.size);
    State.settings.size = order[(idx + 1) % order.length];
    applySize();
    saveState();
    showToast('Размер: ' + State.settings.size);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (State.settings.theme === 'auto') applyTheme();
});

function openModal(contentHtml) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    content.innerHTML = contentHtml;

}
function closeModal() {
    const overlay = document.getElementById('modalOverlay');
    overlay.classList.remove('active');

}

function render() {
    const app = document.getElementById('app');
    let html = '';
    switch (State.view) {
        case 'home': html = renderHome(); break;
        case 'flashcards': html = renderFlashcards(); break;
        case 'vocab': html = renderVocab(); break;
        case 'grammar': html = renderGrammar(); break;
        case 'texts': html = renderTexts(); break;
        case 'translation': html = renderTranslationMenu(); break;
        case 'translation-tickets': html = renderTranslationTickets(); break;

        case 'exam': html = renderExamMenu(); break;

    }
    app.innerHTML = html;
    // Attach event listeners after render
    attachEventListeners();
}

function renderExercise() {
    if (State.exercise.questions.length === 0) {
        return renderExerciseMenu();
    }
    const ex = State.exercise;
    const q = ex.questions[ex.currentIndex];
    if (!q) return '<p>Ошибка: нет вопроса</p>';
    let html = `<div class="panel">
        <div class="panel-header">
            <h2>Упражнение</h2>
            <div class="flex gap-1">
                <span class="text-muted">${ex.currentIndex + 1} / ${ex.questions.length}</span>
                <button class="small" onclick="finishExercise()">Завершить</button>
            </div>
        </div>`;
    html += `<div class="exercise-container">
        <div class="question-text">${q.question}</div>`;
    if (q.type === 'choice') {
        html += '<div class="options">';
        q.options.forEach((opt, i) => {
            let cls = 'option-btn';
            if (ex.answered) {
                if (i === q.correct) cls += ' correct';
                else if (i === ex.selectedOption) cls += ' incorrect';
            }
            html += `<button class="${cls}" onclick="selectOption(${i})" ${ex.answered ? 'disabled' : ''}>${opt}</button>`;
        });
        html += '</div>';
    } else if (q.type === 'input') {
        html += `<input type="text" id="answerInput" placeholder="Введите ответ..." value="${ex.typedAnswer}" ${ex.answered ? 'disabled' : ''} oninput="State.exercise.typedAnswer = this.value">`;
        if (!ex.answered) {
            html += `<button class="primary mt-1" onclick="submitInput()">Проверить</button>`;
        }
    }
    if (ex.showFeedback) {
        html += `<div class="feedback ${ex.feedbackCorrect ? 'correct' : 'incorrect'}">${ex.feedbackText}</div>`;
        if (ex.answered && ex.currentIndex < ex.questions.length - 1) {
            html += `<button class="primary" onclick="nextQuestion()">Далее ▶</button>`;
        } else if (ex.answered && ex.currentIndex >= ex.questions.length - 1) {
            html += `<button class="primary" onclick="finishExercise()">Завершить</button>`;
        }
    }
    html += '</div></div>';
    return html;
}
function renderExerciseMenu() {
    let html = `<div class="panel">
        <div class="panel-header"><h2>Упражнения</h2><button class="small" onclick="setView('home')">🏠</button></div>
        <p class="text-muted mb-1">Выберите тип упражнения:</p>
        <div class="flex gap-1 flex-wrap">
            <button onclick="startExercise('translate-choice')">Выбор перевода</button>
            <button onclick="startExercise('word-choice')">Выбор слова</button>
            <button onclick="startExercise('fill-blank')">Заполнение пропусков</button>
            <button onclick="startExercise('typing')">Ввод слова</button>
            <button onclick="startExercise('match')">Сопоставление</button>
            <button onclick="startExercise('dictation')">Диктант</button>
            <button onclick="startExercise('true-false')">Правда/Ложь</button>
            <button onclick="startExercise('grammar-choice')">Грамматика (выбор)</button>
            <button onclick="startExercise('grammar-fill')">Грамматика (вставка)</button>
            <button onclick="startExercise('reorder')">Составление предложений</button>
            <button onclick="startExercise('mini-test')">Мини-тест</button>
        </div>

function startExercise(type) {
    const ex = State.exercise;
    ex.type = type;
    ex.currentIndex = 0;
    ex.score = 0;
    ex.answered = false;
    ex.selectedOption = null;
    ex.typedAnswer = '';
    ex.showFeedback = false;
    ex.feedbackText = '';
    ex.feedbackCorrect = false;

    let questions = [];
    const allWords = [...VOCAB];
    const shuffled = shuffle(allWords);

    switch (type) {
        case 'translate-choice': {
            const sample = shuffled.slice(0, 15);
            questions = sample.map(w => {
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.translation);
                const options = shuffle([w.translation, ...wrong]);
                return { type: 'choice', question: `Как переводится «${w.chinese}» (${w.pinyin})?`, options, correct: options.indexOf(w.translation), word: w };
            });
            break;
        }
        case 'word-choice': {
            const sample = shuffled.slice(0, 15);
            questions = sample.map(w => {
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.chinese);
                const options = shuffle([w.chinese, ...wrong]);
                return { type: 'choice', question: `Выберите слово для перевода «${w.translation}»`, options, correct: options.indexOf(w.chinese), word: w };
            });
            break;
        }
        case 'fill-blank': {
            const sample = shuffled.filter(w => w.chinese.length >= 2).slice(0, 12);
            questions = sample.map(w => {
                const blanked = w.chinese[0] + '＿'.repeat(w.chinese.length - 1);
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id && x.chinese.length === w.chinese.length)).slice(0, 3).map(x => x.chinese);
                if (wrong.length < 3) {
                    const extra = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3 - wrong.length).map(x => x.chinese);
                    wrong.push(...extra);
                }
                const options = shuffle([w.chinese, ...wrong.slice(0, 3)]);
                return { type: 'choice', question: `Заполните пропуск: ${blanked} (${w.pinyin}) — ${w.translation}`, options, correct: options.indexOf(w.chinese), word: w };
            });
            break;
        }
        case 'typing': {
            const sample = shuffled.slice(0, 12);
            questions = sample.map(w => ({
                type: 'input',
                question: `Напишите по-китайски: «${w.translation}» (${w.pinyin})`,
                answer: w.chinese,
                word: w,
            }));
            break;
        }
        case 'match': {
            // Simplified: 10 pairs, choose correct translation
            const sample = shuffled.slice(0, 10);
            questions = sample.map(w => {
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.translation);
                const options = shuffle([w.translation, ...wrong]);
                return { type: 'choice', question: `Найдите пару для «${w.chinese}»`, options, correct: options.indexOf(w.translation), word: w };
            });
            break;
        }
        case 'dictation': {
            const sample = shuffled.slice(0, 10);
            questions = sample.map(w => ({
                type: 'input',
                question: `«${w.pinyin}» — ${w.translation}. Напишите иероглифами:`,
                answer: w.chinese,
                word: w,
            }));
            break;
        }
        case 'true-false': {
            const sample = shuffled.slice(0, 12);
            questions = sample.map(w => {
                const isTrue = Math.random() > 0.5;
                let shownTranslation = w.translation;
                if (!isTrue) {
                    const other = shuffled.find(x => x.id !== w.id);
                    shownTranslation = other ? other.translation : w.translation;
                }
                return {
                    type: 'choice',
                    question: `«${w.chinese}» означает «${shownTranslation}». Это правда?`,
                    options: ['Правда', 'Ложь'],
                    correct: isTrue ? 0 : 1,
                    word: w,
                };
            });
            break;
        }
        case 'grammar-choice': {
            const sample = shuffle(GRAMMAR).slice(0, 10);
            questions = sample.map(g => {
                const wrong = shuffle(GRAMMAR.filter(x => x.id !== g.id)).slice(0, 3).map(x => x.title);
                const options = shuffle([g.title, ...wrong]);
                return { type: 'choice', question: `Какая конструкция используется для: «${g.explanation}»?`, options, correct: options.indexOf(g.title), grammar: g };
            });
            break;
        }
        case 'grammar-fill': {
            const sample = shuffle(GRAMMAR).slice(0, 8);
            questions = sample.map(g => {
                const ex = g.examples[0];
                const blanked = ex.replace(g.title.replace(/……/g, '').trim(), '＿＿＿');
                const wrong = shuffle(GRAMMAR.filter(x => x.id !== g.id)).slice(0, 3).map(x => x.title);
                const options = shuffle([g.title, ...wrong]);
                return { type: 'choice', question: `Заполните пропуск: ${blanked}`, options, correct: options.indexOf(g.title), grammar: g };
            });
            break;
        }
        case 'reorder': {
            const sample = shuffle(TEXTS).slice(0, 5);
            questions = sample.map(t => {
                const sentences = t.content.split('\n').filter(s => s.trim().length > 0);
                const sentence = sentences[Math.floor(Math.random() * sentences.length)];
                // Split into chunks (2-3 characters)
                const chunks = [];
                for (let i = 0; i < sentence.length; i += 2) {
                    chunks.push(sentence.substring(i, i + 2));
                }
                const shuffledChunks = shuffle(chunks);
                return {
                    type: 'choice',
                    question: `Восстановите порядок: ${shuffledChunks.join(' / ')}`,
                    options: [sentence, ...shuffle(sentences.filter(s => s !== sentence)).slice(0, 3)],
                    correct: 0, // will be adjusted
                    original: sentence,
                };
            });
            // For reorder, we need custom handling: compare selected option to original
            questions = questions.map(q => {
                const opts = shuffle(q.options);
                return { ...q, options: opts, correct: opts.indexOf(q.original) };
            });
            break;
        }
        case 'mini-test': {
            const sample = shuffle([
                ...shuffled.slice(0, 5).map(w => ({ type: 'choice', question: `Перевод «${w.chinese}»?`, options: shuffle([w.translation, ...shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.translation)]), correct: 0, word: w })),
                ...shuffle(GRAMMAR).slice(0, 5).map(g => ({ type: 'choice', question: `Конструкция: ${g.explanation}?`, options: shuffle([g.title, ...shuffle(GRAMMAR.filter(x => x.id !== g.id)).slice(0, 3).map(x => x.title)]), correct: 0, grammar: g })),
            ]);
            // Fix correct indices
            questions = sample.map(q => {
                const opts = shuffle(q.options);
                return { ...q, options: opts, correct: opts.indexOf(q.options[0]) };
            });
            break;
        }
    }

    ex.questions = questions;
    State.view = 'exercise';
    render();
}
function selectOption(i) {
    const ex = State.exercise;
    if (ex.answered) return;
    const q = ex.questions[ex.currentIndex];
    ex.selectedOption = i;
    ex.answered = true;
    ex.showFeedback = true;
    const correct = q.correct;
    if (i === correct) {
        ex.score++;
        State.stats.correct++;
        ex.feedbackText = '✅ Правильно!';
        ex.feedbackCorrect = true;
    } else {
        State.stats.errors++;
        ex.feedbackText = `❌ Неправильно. Правильный ответ: ${q.options[correct]}`;
        ex.feedbackCorrect = false;
    }
    saveState();
    render();
}
function submitInput() {
    const ex = State.exercise;
    if (ex.answered) return;
    const q = ex.questions[ex.currentIndex];
    const answer = (ex.typedAnswer || '').trim().toLowerCase();
    const correctAnswer = q.answer.toLowerCase();
    ex.answered = true;
    ex.showFeedback = true;
    if (answer === correctAnswer) {
        ex.score++;
        State.stats.correct++;
        ex.feedbackText = '✅ Правильно!';
        ex.feedbackCorrect = true;
    } else {
        State.stats.errors++;
        ex.feedbackText = `❌ Неправильно. Правильный ответ: ${q.answer}`;
        ex.feedbackCorrect = false;
    }
    saveState();
    render();
}
function nextQuestion() {
    const ex = State.exercise;
    if (ex.currentIndex < ex.questions.length - 1) {
        ex.currentIndex++;
        ex.answered = false;
        ex.selectedOption = null;
        ex.typedAnswer = '';
        ex.showFeedback = false;
        ex.feedbackText = '';
        ex.feedbackCorrect = false;
        render();
    } else {
        finishExercise();
    }
}
function finishExercise() {
    const ex = State.exercise;
    const total = ex.questions.length;
    const score = ex.score;
    const pct = total > 0 ? Math.round((score / total) * 100) : 0;
    State.stats.completedExercises++;
    saveState();
    openModal(`<h3>Результат</h3>
        <p>Правильных ответов: ${score} из ${total} (${pct}%)</p>
        <div class="progress-bar mt-1"><div style="width:${pct}%"></div></div>
        <div class="mt-2 flex gap-1">
            <button onclick="closeModal(); startExercise('${ex.type}')">Повторить</button>
            <button onclick="closeModal(); setView('home')">В меню</button>
        </div>`);
    State.exercise = { type: null, questions: [], currentIndex: 0, score: 0, answered: false, selectedOption: null, typedAnswer: '', showFeedback: false, feedbackText: '', feedbackCorrect: false };
    render();
}

    </div>`;

function performSearch() {
    const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const results = document.getElementById('searchResults');
    if (!query) { results.innerHTML = ''; return; }
    // Search vocab
    const wordResults = VOCAB.filter(w =>
        w.chinese.toLowerCase().includes(query) ||
        w.pinyin.toLowerCase().includes(query) ||
        w.translation.toLowerCase().includes(query) ||
        w.topic.toLowerCase().includes(query)
    ).slice(0, 20);
    // Search grammar
    const grammarResults = GRAMMAR.filter(g =>
        g.title.toLowerCase().includes(query) ||
        g.explanation.toLowerCase().includes(query)
    ).slice(0, 10);
    // Search tickets
    const ticketResults = TRANSLATION_TICKETS.filter(t =>
        t.question.toLowerCase().includes(query) ||
        t.keywords.some(k => k.toLowerCase().includes(query))
    ).slice(0, 10);
    const grammarTicketResults = GRAMMAR_TICKETS.filter(t =>
        t.question.toLowerCase().includes(query) ||
        t.fullAnswer.toLowerCase().includes(query)
    ).slice(0, 10);

    let html = '';
    if (wordResults.length > 0) {
        html += '<h4>Слова</h4>';
        wordResults.forEach(w => {
            html += `<div class="list-item">
                <div><span class="chinese">${w.chinese}</span> <span class="pinyin">${w.pinyin}</span></div>
                <div class="translation">${w.translation}</div>
            </div>`;
        });
    }
    if (grammarResults.length > 0) {
        html += '<h4 class="mt-1">Грамматика</h4>';
        grammarResults.forEach(g => {
            html += `<div class="list-item"><div><strong>${g.title}</strong> — ${g.explanation}</div></div>`;
        });
    }
    if (ticketResults.length > 0) {
        html += '<h4 class="mt-1">Билеты (перевод)</h4>';
        ticketResults.forEach(t => {
            html += `<div class="list-item"><div>${t.question}</div></div>`;
        });
    }
    if (grammarTicketResults.length > 0) {
        html += '<h4 class="mt-1">Билеты (грамматика)</h4>';
        grammarTicketResults.forEach(t => {
            html += `<div class="list-item"><div>${t.question}</div></div>`;
        });
    }
    if (!html) html = '<p class="text-muted">Ничего не найдено</p>';
    results.innerHTML = html;
}

function clearProgress() {
    if (confirm('Вы уверены, что хотите очистить весь прогресс?')) {
        State.stats = { studiedWords: {}, completedExercises: 0, errors: 0, correct: 0, grammarProgress: {}, ticketProgress: {}, grammarTicketProgress: {} };
        saveState();

    }

function exportProgress() {
    const data = JSON.stringify({ stats: State.stats, settings: State.settings });
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'boya2_progress.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Экспортировано');
}
function importProgress() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.stats) State.stats = { ...State.stats, ...data.stats };
                if (data.settings) State.settings = { ...State.settings, ...data.settings };
                saveState();
                applyTheme();
                applySize();
                showToast('Импортировано');
                render();
            } catch (err) {
                showToast('Ошибка импорта');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

        return { type: 'choice', question: `Какая конструкция: ${g.explanation}?`, options, correct: options.indexOf(g.title) };

    State.exercise = {
        type: 'exam',
